<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>B22 Photo Booth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <img id="bg" src="B22_Opening_Page.jpg">

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  
  <div id="flash"></div>
  
  <div id="countdown"></div>

  <button id="enterBtn" class="hotspot enter"></button>
  <button id="photoModeBtn" class="hotspot photo"></button>
  <button id="videoModeBtn" class="hotspot video"></button>
  <button id="colorBtn" class="hotspot color"></button>
  <button id="bwBtn" class="hotspot bw"></button>
  <button id="printBtn" class="hotspot print"></button>
  <button id="restartBtn" class="hotspot restart"></button>
</div>

<script src="script.js"></script>
</body>
</html>
